[MANDATORY]
data_directory = ./raw/

[OPTIONAL]
path_to_flight_ids = ./raw/
path_to_l0_files = {flight_id}/
platforms = HALO
platform_directory_names = .
product_dir = ./products/

[GLOBAL_ATTRS]
title = Dropsonde data from the ORCESTRA field campaign 2024
source = dropsondes
creator_name = Helene Gloeckner, Theresa Mieslinger, Nina Robbins
creator_email = helene.gloeckner@mpimet.mpg.de, theresa.mieslinger@mpimet.mpg.de, nina.robbins@mpimet.mpg.de
project = ORCESTRA, PERCUSION, MAESTRO
platform = HALO
references = https://github.com/atmdrops/pydropsonde
license = CC-BY-4.0

[L2_ATTRS]
featureType = profile
title = BEACH dropsonde dataset (Level 2)
keywords = ORCESTRA, BEACH, Sounding, Dropsondes, Tropics, Atmospheric Profiles, Full QC
summary = This dataset is part of the Level 2 BEACH datasets. It contains ASPEN-quality controlled dropsonde data from one sonde from the ORCESTRA field campaign. Additional QC flags from the pydropsonde package are included. Use this dataset if you need a valid time variable for the sonde drop (e.g. fall speeds). In BEACH Level 3, all sondes are combined to a common altitude. BEACH Level 4 contains the circle products.


[L3_ATTRS]
featureType = trajectoryProfile
title = BEACH dropsonde dataset (Level 3)
keywords = ORCESTRA, BEACH, Sounding, Dropsondes, Tropics, Atmospheric Profiles, Common Altitude
summary = This dataset is the Level 3 BEACH dataset. It contains ASPEN-quality controlled dropsonde data from one sonde from the ORCESTRA field campaign. It contains all sondes that detected a launch and have valid data from the ORCESTRA field campaign with a common altitude dimension. Individual sonde QC can be checked in the sonde_qc variable. For more details on the QC refer to the separate Level_3_QC dataset or the BEACH Level 2 datasets. For analyses using the time, refer to the BEACH Level 2 datasets. Circle products, like divergence and vertical velocity can be fonud in BEACH Level 4.

[L4_ATTRS]
featureType = trajectoryProfile
title = BEACH dropsonde dataset (Level 4)
keywords = ORCESTRA, BEACH, Sounding, Dropsondes, Tropics, Atmospheric Profiles, Circle Products
summary = This dataset is the Level 3 BEACH dataset. It contains all sondes that belong to a circle during ORCESTRA, binned to a common altitude and interpolated using akima interpolation. Additionally, circle products (Bony & Stevens 2019) can be found here. For not-interpolated sonde data and sondes that do not belong to a circle, refer to BEACH Level 3.


[processor.Sonde.add_flight_id]
flight_template = {flight_id}

[processor.Sonde.add_level_dir]
l1_dir = ./products/Level_1/{flight_id}
l2_dir = ./products/Level_2/{flight_id}

[processor.Sonde.get_l2_filename]
l2_filename_template = PERCUSION_{serial_id}_Level_2.zarr
[processor.Sonde.check_interim_l3]
interim_l3_filename = interim_l3_{sonde_id}_{version}.zarr


[processor.Sonde.set_alt_dim]
alt_dim=gpsalt

[processor.Sonde.add_qc_to_interim_l3]
keep=all

[processor.Gridded.get_l3_filename]
l3_filename = PERCUSION_Level_3.zarr

[processor.Gridded.get_l3_dir]
l3_dir =  ./products/Level_3

[processor.Gridded.remove_qc_from_l3]
filename=PERCUSION_Level_3_qc.zarr

[processor.Gridded.get_circle_times_from_segmentation]
yaml_file=https://orcestra-campaign.github.io/flight_segmentation/all_flights.yaml

[circles.Circle.apply_interp_na]
method = akima

[processor.Gridded.get_l4_dir] 
l4_dir =  ./products/Level_4

[processor.Gridded.get_l4_filename]
l4_filename = PERCUSION_Level_4.zarr
